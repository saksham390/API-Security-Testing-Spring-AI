spring:
  application:
    name: api-security-backend

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          temperature: 0.1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/api_security}
    username: ${DB_USERNAME:api_security_user}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-this-to-a-long-random-value}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
